spring.application.name=multi-module-library

# === Base de donnees ===
spring.datasource.url=jdbc:mysql://localhost:3306/sigl
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# === Logging pour debug ===
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

# === Swagger / OpenAPI ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# === JWT ===
# Cle secrete encodee en BASE64 (>= 256 bits pour HS256).
# A REMPLACER PAR UNE VALEUR D'ENVIRONNEMENT EN PRODUCTION.
app.jwt.secret=ZjQ4NmI1MWFhZjQ5OTI4OTdjMWQ4ZTRiMmEzNTk0MzM2YTQyZTYxNzJlYjlkNzY1YmI0NDhmZjFjNzhmOWE0Mg==
app.jwt.expiration-ms=86400000

# === Upload PDF ===
app.upload-dir=./uploads/rapports
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
